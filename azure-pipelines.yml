trigger:
  branches:
    include:
      - main

variables:
  imageTag: '$(Build.BuildId)'
  dockerImageName: 'alpitg/crm-api-python'
  containerRegistry: 'dockerhub-service-connection'

stages:

# ===========================
# Build and Push Docker Image
# ===========================
- stage: Build_CRM_API
  displayName: Build and Push CRM API

  jobs:
    - job: Docker_Build

      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self

        # Login to Docker Hub
        - task: Docker@2
          displayName: Login to Docker Hub
          inputs:
            command: login
            containerRegistry: $(containerRegistry)

        # Build and Push Image
        - task: Docker@2
          displayName: Build and Push CRM API
          inputs:
            command: buildAndPush
            repository: $(dockerImageName)
            dockerfile: Dockerfile
            buildContext: .
            containerRegistry: $(containerRegistry)
            tags: |
              $(imageTag)
              latest
